<style>
  :root {
    --bg: #F7F9FC; --bg-2: #FFFFFF; --fg: #0B1220; --fg-2: #4A5568;
    --accent: #1F6FE5;      /* 4.7:1 on white; scene uses brighter #298DFF */
    --on-accent: #FFFFFF; --line: #0B122014; --glow: #298DFF22;
    --display: "Space Grotesk", system-ui, sans-serif; --display-weight: 600; --display-stretch: 100%; --display-case: none; --display-track: -0.035em;
    --body: Inter, system-ui, sans-serif; --mono: "JetBrains Mono", monospace; --radius: 28px;
    --up: #0E8A4F; --down: #D12F3B;
  }
  .hero h1 { line-height: .9; }
  .xcard, .tile, .bx, .vcard, .app { box-shadow: 0 1px 0 #0B122008, 0 24px 48px -32px #1F6FE540; }
  .xcard .bgnum { color: #1F6FE50D; }
  .bx.accent { background: linear-gradient(135deg, #1F6FE5, #298DFF 60%, #5CC8FF); border: 0; }
  .num { background: var(--bg-2); }
  .nums { background: var(--line); }
  .toast { box-shadow: 0 18px 40px -24px #1F6FE566; }
  .finale { background: linear-gradient(180deg, var(--bg), #EAF2FF); }
  #ventures { background: radial-gradient(ellipse at 10% 10%, #298DFF14, transparent 50%); }

<div id="app"></div>
<noscript><p style="padding:24px">Shaik Mahammad · Workday Integration Consultant · <a href="mailto:Mohammadshaik345@gmail.com">Mohammadshaik345@gmail.com</a></p></noscript>

<script src="../assets/content.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
window.VARIANT = {
  id: "liquid", name: "Liquid", logo: "moh",
  claim: "Data that<br><em>flows.</em>",
  sceneLabel: "A field of blue dots rippling like water, reacting to the cursor",
  headings: {
    impact: "Rivers of data,<br><em>well channelled.</em>",
    experience: "Upstream<br><em>to production.</em>",
    secure: "Watertight<br><em>by design.</em>",
    stack: "Every<br><em>connector.</em>",
    ventures: "Liquidity,<br><em>honestly.</em>",
    contact: "Let's get<br><em>flowing.</em>",
  },
  updown: { green: ["#0E8A4F", "#D12F3B"], red: ["#D12F3B", "#0E8A4F"], blue: ["#1F6FE5", "#C2570C"], mono: ["#0B1220", "#5B6578"] },

  scene(canvas, { RM }) {
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(45, 1, .1, 100);
    const small = innerWidth < 700, NX = small ? 80 : 150, NZ = small ? 50 : 80, SX = 34, SZ = 22;
    const geo = new THREE.BufferGeometry(), pos = new Float32Array(NX * NZ * 3), col = new Float32Array(NX * NZ * 3);
    const a = new THREE.Color("#298DFF"), b = new THREE.Color("#5CC8FF"), c = new THREE.Color("#1F3B8A");
    for (let z = 0, k = 0; z < NZ; z++) for (let x = 0; x < NX; x++, k++) {
      pos[k * 3] = (x / (NX - 1) - .5) * SX; pos[k * 3 + 2] = (z / (NZ - 1) - .5) * SZ;
      const t = x / (NX - 1), cc = a.clone().lerp(b, t).lerp(c, z / NZ * .5);
      col[k * 3] = cc.r; col[k * 3 + 1] = cc.g; col[k * 3 + 2] = cc.b;
    }
    geo.setAttribute("position", new THREE.BufferAttribute(pos, 3)); geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
    const pts = new THREE.Points(geo, new THREE.PointsMaterial({ size: small ? .09 : .07, vertexColors: true, transparent: true, opacity: .9 }));
    scene.add(pts);

    let p = 0, mx = 99, mz = 99, vis = true, tmx = 99, tmz = 99;
    const ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
    addEventListener("pointermove", (ev) => {
      const r = canvas.getBoundingClientRect(); if (ev.clientY > r.bottom) return;
      ray.setFromCamera({ x: (ev.clientX - r.left) / r.width * 2 - 1, y: -((ev.clientY - r.top) / r.height) * 2 + 1 }, camera);
      if (ray.ray.intersectPlane(plane, hit)) { tmx = hit.x; tmz = hit.z; }
    }, { passive: true });
    new IntersectionObserver(([en]) => vis = en.isIntersecting).observe(canvas);
    const size = () => { const w = canvas.clientWidth, h = canvas.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); };
    size(); addEventListener("resize", size);

    const t0 = performance.now();
    const loop = (t) => {
      requestAnimationFrame(loop); if (!vis) return;
      const time = RM ? 0 : (t - t0) / 1000, amp = .35 + p * .9;
      mx += (tmx - mx) * .08; mz += (tmz - mz) * .08;
      for (let i = 0; i < NX * NZ; i++) {
        const x = pos[i * 3], z = pos[i * 3 + 2];
        let y = Math.sin(x * .45 + time * 1.1) * .35 * amp + Math.sin(z * .6 + time * .8) * .25 * amp + Math.sin((x + z) * .25 + time * .5) * .4 * amp;
        const d = Math.hypot(x - mx, z - mz); if (d < 4) y += Math.cos(d * 2.2 - time * 4) * (1 - d / 4) * .5;
        pos[i * 3 + 1] = y;
      }
      geo.attributes.position.needsUpdate = true;
      camera.position.set(0, 3.2 + p * 4, 11 - p * 4); camera.lookAt(0, -.5 - p * 1.5, -2);
      pts.rotation.y = RM ? 0 : Math.sin(time * .1) * .06;
      renderer.render(scene, camera);
    };
    requestAnimationFrame(loop);
    return { setProgress(v) { p = v; } };
  },
};
</script>
<script src="../assets/engine.js"></script>
</body>
</html>
