<meta name="description" content="Shaik Mahammad (Moh), Workday Integration & Reporting Consultant at Deloitte. Arizona theme.">

<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

<style>
  :root {
    /* Sonoran night: ASU maroon & gold, sandstone and copper */
    --bg: #170D12; --bg-2: #22141B; --fg: #F7EBDD; --fg-2: #CDB8A6;
    --accent: #FFC627; --on-accent: #170D12; --line: #F7EBDD1F; --glow: #D9733B33;
    --maroon: #8C1D40; --copper: #D9733B; --sand: #E8C9A0;
    --display: "Big Shoulders Display", Impact, sans-serif; --display-weight: 900; --display-stretch: 100%; --display-case: uppercase; --display-track: 0;
    --body: Inter, system-ui, sans-serif; --mono: "IBM Plex Mono", monospace; --radius: 18px;
    --up: #5FD68A; --down: #FF7A7A;
  }
  .display em { color: var(--accent); }
  h2.display { font-size: clamp(48px, 8vw, 128px); }
  .hero h1 { font-size: clamp(44px, 10vw, 168px); line-height: .88; }
  .hero::after { content: ""; position: absolute; inset: auto 0 0 0; height: 40%; background: linear-gradient(transparent, #170D12E6); pointer-events: none; z-index: 1; }
  .xcard { background: linear-gradient(160deg, #2A1720, #170D12); }
  .xcard::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, var(--maroon), var(--copper), var(--accent)); }
  .bx.accent { background: linear-gradient(135deg, var(--maroon), #5E1230); border-color: var(--maroon); color: #FFF4E0; }
  .bx.accent .mono { color: var(--accent); }
  .tile .ic { background: #D9733B26; color: var(--copper); }
  .kicker::after { background: linear-gradient(90deg, var(--copper), transparent); }
  .chip:first-child { background: var(--maroon); border-color: var(--maroon); color: #FFF4E0; }
  /* topo-line texture behind sections */
  #secure, #ventures { background: radial-gradient(ellipse at 80% 0%, #8C1D4026, transparent 55%); }
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px">Shaik Mahammad · Workday Integration Consultant · <a href="mailto:Mohammadshaik345@gmail.com">Mohammadshaik345@gmail.com</a></p></noscript>

<script src="assets/content.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
window.VARIANT = {
  id: "arizona", name: "Arizona", themeBase: "./", homeHref: "./", logo: "MOH",
  claim: "Tempe-trained.<br><em>Enterprise-tested.</em>",
  chips: ["M.S. · Arizona State", "70+ integrations", "4× Workday certified"],
  sceneLabel: "A low-poly Sonoran desert with mesas and saguaro cacti; the sun sets and stars appear as you scroll",
  headings: {
    impact: "Big skies.<br><em>Bigger scale.</em>",
    experience: "The trail<br><em>so far.</em>",
    secure: "Fortified<br><em>like a mesa.</em>",
    stack: "Field kit<br><em>for Workday.</em>",
    ventures: "Mesa<br><em>Signal.</em>",
    contact: "Meet me<br><em>at sunset.</em>",
  },
  updown: { green: ["#5FD68A", "#FF7A7A"], red: ["#FF7A7A", "#5FD68A"], blue: ["#6CB8FF", "#FFB066"], mono: ["#F7EBDD", "#CDB8A6"] },

  scene(canvas, { RM }) {
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.outputEncoding = THREE.sRGBEncoding;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, 1, .1, 200);
    camera.position.set(0, 2.4, 9);

    // palettes: dusk (p=0) -> night (p=1)
    const C = (h) => new THREE.Color(h);
    const sky = { topA: C("#3B1F4A"), botA: C("#F08A4B"), topB: C("#0B0716"), botB: C("#3A1830") };
    const fogA = C("#D9733B"), fogB = C("#1A0F1E");

    // sky dome with vertical gradient
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false,
      uniforms: { top: { value: sky.topA.clone() }, bot: { value: sky.botA.clone() } },
      vertexShader: "varying vec3 vP; void main(){ vP = (modelMatrix * vec4(position,1.)).xyz; gl_Position = projectionMatrix * viewMatrix * vec4(vP,1.); }",
      fragmentShader: "uniform vec3 top; uniform vec3 bot; varying vec3 vP; void main(){ float h = clamp(normalize(vP).y * 2.2 + .15, 0., 1.); gl_FragColor = vec4(mix(bot, top, pow(h,.8)), 1.); }",
    });
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(90, 32, 16), skyMat));

    // sun
    const sun = new THREE.Mesh(new THREE.CircleGeometry(2.6, 48), new THREE.MeshBasicMaterial({ color: 0xffc627, fog: false }));
    sun.position.set(-4, 9, -60); scene.add(sun);
    const halo = new THREE.Mesh(new THREE.CircleGeometry(5.5, 48), new THREE.MeshBasicMaterial({ color: 0xffb066, transparent: true, opacity: .25, fog: false }));
    halo.position.copy(sun.position).add(new THREE.Vector3(0, 0, -.1)); scene.add(halo);

    // stars
    const starGeo = new THREE.BufferGeometry(), sp = [];
    for (let i = 0; i < 700; i++) { const th = Math.random() * Math.PI * 2, ph = Math.random() * Math.PI * .42; sp.push(80 * Math.sin(ph) * Math.cos(th), 80 * Math.cos(ph) + 2, -Math.abs(80 * Math.sin(ph) * Math.sin(th))); }
    starGeo.setAttribute("position", new THREE.Float32BufferAttribute(sp, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xfff4e0, size: .35, transparent: true, opacity: 0, fog: false }));
    scene.add(stars);

    // terrain with mesas
    const hash = (x, z) => { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); };
    const noise = (x, z) => { const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi, u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
      return (hash(xi, zi) * (1 - u) + hash(xi + 1, zi) * u) * (1 - v) + (hash(xi, zi + 1) * (1 - u) + hash(xi + 1, zi + 1) * u) * v; };
    const mesas = [[-14, -34, 6, 5.5], [9, -40, 8, 7], [24, -30, 4, 4], [-30, -44, 7, 6], [2, -55, 10, 9]];
    const smooth = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };
    const height = (x, z) => {
      let h = noise(x * .18, z * .18) * 1.1 + noise(x * .5, z * .5) * .25 - .6;
      for (const [mx, mz, r, mh] of mesas) { const d = Math.hypot(x - mx, (z - mz) * 1.3); h += smooth(r + 1.4, r, d) * mh + smooth(r + 4, r + 1.4, d) * .8; }
      return h;
    };
    const geo = new THREE.PlaneGeometry(140, 90, 140, 90); geo.rotateX(-Math.PI / 2); geo.translate(0, 0, -30);
    const pos = geo.attributes.position, cols = [];
    const sand = C("#C98A5A"), copper = C("#B4542A"), rock = C("#7A2A2E"), deep = C("#4A1E2A");
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), z = pos.getZ(i), y = height(x, z); pos.setY(i, y);
      const c = y < .3 ? sand.clone().lerp(copper, Math.max(0, y + .6)) : y < 3 ? copper.clone().lerp(rock, (y - .3) / 2.7) : rock.clone().lerp(deep, Math.min(1, (y - 3) / 5));
      c.offsetHSL(0, 0, (hash(x, z) - .5) * .05); cols.push(c.r, c.g, c.b);
    }
    geo.setAttribute("color", new THREE.Float32BufferAttribute(cols, 3)); geo.computeVertexNormals();
    scene.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 1 })));

    // saguaros
    const cactusMat = new THREE.MeshStandardMaterial({ color: 0x3f6b3a, flatShading: true, roughness: .9 });
    const saguaro = (x, z, s) => {
      const g = new THREE.Group(), trunk = new THREE.Mesh(new THREE.CylinderGeometry(.16, .2, 2.4, 7), cactusMat); trunk.position.y = 1.2; g.add(trunk);
      [[-1, .9, 1.1], [1, 1.3, .8]].forEach(([side, y, len]) => {
        const out = new THREE.Mesh(new THREE.CylinderGeometry(.11, .11, .5, 6), cactusMat); out.rotation.z = Math.PI / 2; out.position.set(side * .38, y, 0); g.add(out);
        const up = new THREE.Mesh(new THREE.CylinderGeometry(.11, .12, len, 6), cactusMat); up.position.set(side * .62, y + len / 2 - .05, 0); g.add(up);
      });
      g.position.set(x, height(x, z) - .05, z); g.scale.setScalar(s); g.rotation.y = hash(x, z) * 6; scene.add(g);
    };
    [[-6, -2, 1], [5.5, -6, 1.2], [-11, -10, 1.1], [12, -12, 1], [-3, -16, .9], [8, -20, 1], [-16, -22, 1.2], [18, -6, 1.1], [1.5, -9, .7]].forEach(a => saguaro(...a));

    // lights
    const hemi = new THREE.HemisphereLight(0xffd6a0, 0x3a1830, .9); scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffb066, 1.6); dir.position.set(-10, 8, -20); scene.add(dir);
    scene.fog = new THREE.Fog(fogA.clone(), 18, 75);

    let p = 0, mx = 0, my = 0, vis = true;
    addEventListener("pointermove", (ev) => { mx = ev.clientX / innerWidth - .5; my = ev.clientY / innerHeight - .5; }, { passive: true });
    new IntersectionObserver(([en]) => vis = en.isIntersecting).observe(canvas);
    const size = () => { const w = canvas.clientWidth, h = canvas.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < 700 ? 64 : 50; camera.updateProjectionMatrix(); };
    size(); addEventListener("resize", size);

    const apply = () => {
      skyMat.uniforms.top.value.copy(sky.topA).lerp(sky.topB, p);
      skyMat.uniforms.bot.value.copy(sky.botA).lerp(sky.botB, p);
      scene.fog.color.copy(fogA).lerp(fogB, p);
      sun.position.y = 9 - p * 12; halo.position.y = sun.position.y; halo.material.opacity = .25 * (1 - p);
      stars.material.opacity = Math.max(0, p * 1.3 - .2);
      dir.intensity = 1.6 * (1 - p) + .15; hemi.intensity = .9 - p * .55;
    };
    apply();
    const t0 = performance.now();
    const loop = (t) => {
      requestAnimationFrame(loop); if (!vis) return;
      const time = (t - t0) / 1000;
      camera.position.x += ((RM ? 0 : mx * 1.6) - camera.position.x) * .04;
      camera.position.y += ((RM ? 2.4 : 2.4 - my * .8) - camera.position.y) * .04;
      camera.position.z = 9 - (RM ? 0 : Math.sin(time * .08) * 1.2) - p * 3;
      camera.lookAt(0, 2.2 - p * .6, -30);
      stars.rotation.y = RM ? 0 : time * .004;
      renderer.render(scene, camera);
    };
    requestAnimationFrame(loop);
    return { setProgress(v) { p = v; apply(); } };
  },
};
</script>
<script src="assets/engine.js"></script>
</body>
</html>
